<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="KouziaConverter — Convert videos, images and icons locally, without uploading anything.">
<defs>
<style>
@font-face { font-family:'Exo 2'; font-weight:400 700; src:url(data:font/woff2;base64,) format('woff2'); }
@font-face { font-family:'Share Tech Mono'; src:url(data:font/woff2;base64,) format('woff2'); }
.label { font:15px 'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace; letter-spacing:.14em; fill:#fe9a00; }
.title { font:700 30px 'Exo 2',system-ui,'Segoe UI',Roboto,sans-serif; fill:#e8eaf8; }
.body  { font:400 18px 'Exo 2',system-ui,'Segoe UI',Roboto,sans-serif; fill:#9aa1bf; }
.chip  { font:600 15px 'Exo 2',system-ui,'Segoe UI',Roboto,sans-serif; }
.chipm { font:15px 'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace; }
.link  { font:17px 'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace; fill:#fe9a00; }
.logo  { font:84px 'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace; letter-spacing:.06em; }
.sub   { font:600 28px 'Exo 2',system-ui,'Segoe UI',Roboto,sans-serif; fill:#e8eaf8; }
.meta  { font:600 17px 'Exo 2',system-ui,'Segoe UI',Roboto,sans-serif; fill:#9aa1bf; letter-spacing:.12em; }
.cursor { animation:blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity:0; } }
</style>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb900"/><stop offset=".55" stop-color="#fe9a00"/><stop offset="1" stop-color="#f07800"/></linearGradient>
<radialGradient id="gi" cx=".85" cy=".1" r=".6"><stop offset="0" stop-color="#615fff" stop-opacity=".2"/><stop offset="1" stop-color="#615fff" stop-opacity="0"/></radialGradient>
<radialGradient id="ga" cx=".05" cy=".3" r=".5"><stop offset="0" stop-color="#fe9a00" stop-opacity=".14"/><stop offset="1" stop-color="#fe9a00" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#232d47" stroke-opacity=".5"/></pattern>
<clipPath id="card"><rect width="600" height="300" rx="22"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="600" height="300" fill="#0b1020"/>
<rect width="600" height="300" fill="url(#grid)"/>
<rect width="600" height="300" fill="url(#gi)"/>
<rect width="600" height="300" fill="url(#ga)"/>
</g>
<rect x=".5" y=".5" width="599" height="299" rx="22" fill="none" stroke="#232d47"/>
