<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Kouzia — Custom websites and software">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="1" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .logo { font: 700 78px 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .sub  { font: 500 26px -apple-system,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif; fill:#cbd5e1; }
      .meta { font: 400 18px -apple-system,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif; fill:#64748b; letter-spacing:2px; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow1)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow2)"/>

  <text x="80" y="140" class="logo">
    <tspan fill="#64748b">&lt;</tspan><tspan fill="url(#accent)">Kouzia</tspan><tspan fill="#64748b">/&gt;</tspan><tspan fill="#06b6d4" class="cursor">_</tspan>
  </text>

  <rect x="80" y="166" width="90" height="4" rx="2" fill="url(#accent)"/>

  <text x="80" y="214" class="sub">Custom websites and software that work for you.</text>
  <text x="80" y="254" class="meta">INDEPENDENT WEB DEVELOPER · HUELGOAT · BRITTANY, FRANCE</text>
</svg>
